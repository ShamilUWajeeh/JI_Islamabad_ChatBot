backgroundColor = "#FFFFFF"     # Pure White (Main Background)
secondaryBackgroundColor = "#F6F8F7" # Soft Off-White (Sidebar/Cards)
textColor = "#111111"           # Deep Black (Main Text)
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false